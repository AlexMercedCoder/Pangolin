{{/*
  deployment.yaml sets `serviceAccountName` from a helper that, with the default
  `serviceAccount.create: true`, resolves to a name no template ever created.
  Pods would fail admission in most clusters (A-34).
*/}}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pangolin.serviceAccountName" . }}
  labels:
    {{- include "pangolin.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{/*
  Pangolin does not talk to the Kubernetes API, so it has no use for a mounted
  token.
*/}}
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
