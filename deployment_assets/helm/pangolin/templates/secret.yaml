{{/*
  Only rendered when the chart is asked to manage the Secret itself. Prefer
  `createSecret: false` with `existingSecret` pointing at a Secret managed by an
  external secret store: base64-encoding credentials out of values.yaml
  encourages committing them to Git (C-10).
*/}}
{{- if and .Values.createSecret (not .Values.existingSecret) -}}
{{- if not .Values.secrets.PANGOLIN_JWT_SECRET -}}
{{- fail "secrets.PANGOLIN_JWT_SECRET is required. Generate one with `openssl rand -base64 48` and pass it with --set-string, or set existingSecret to a Secret you manage. There is deliberately no default: the previous \"change-me-please\" was a working value." -}}
{{- end -}}
{{- if lt (len .Values.secrets.PANGOLIN_JWT_SECRET) 32 -}}
{{- fail "secrets.PANGOLIN_JWT_SECRET must be at least 32 characters. The server rejects shorter secrets at startup." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pangolin.fullname" . }}-secret
  labels:
    {{- include "pangolin.labels" . | nindent 4 }}
type: Opaque
data:
  PANGOLIN_JWT_SECRET: {{ .Values.secrets.PANGOLIN_JWT_SECRET | b64enc | quote }}
  {{- with .Values.secrets.DATABASE_URL }}
  DATABASE_URL: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.AWS_ACCESS_KEY_ID }}
  AWS_ACCESS_KEY_ID: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.PANGOLIN_ROOT_PASSWORD }}
  PANGOLIN_ROOT_PASSWORD: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
