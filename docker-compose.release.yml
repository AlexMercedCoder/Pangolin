version: '3.8'

services:
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - minio_data_release:/data

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/warehouse;
      /usr/bin/mc anonymous set public myminio/warehouse;
      /usr/bin/mc mb myminio/warehouse-acme;
      /usr/bin/mc anonymous set public myminio/warehouse-acme;
      exit 0;
      "

  pangolin-api:
    # B10: this pinned 0.2.0 - four releases behind the workspace - so the
    # "release verification" compose file verified an image nobody ships.
    # Parameterised so a release can be tested by setting PANGOLIN_VERSION,
    # with the current version as the default.
    image: alexmerced/pangolin-api:${PANGOLIN_VERSION:-0.6.0}
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      # B9: the server reads PANGOLIN_STORAGE_TYPE; PANGOLIN_STORE_TYPE was
      # silently ignored.
      - PANGOLIN_STORAGE_TYPE=memory
      # B8: the server refuses to start without a JWT secret.
      - PANGOLIN_JWT_SECRET=${PANGOLIN_JWT_SECRET:?set it first, e.g. export PANGOLIN_JWT_SECRET=$(openssl rand -base64 48)}
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://minio:9000
      - AWS_ALLOW_HTTP=true
      - PANGOLIN_NO_AUTH=${PANGOLIN_NO_AUTH:-false}
    depends_on:
      minio:
        condition: service_healthy

  tests:
    image: python:3.11-slim
    volumes:
      - ./scripts:/app/scripts
    working_dir: /app
    environment:
      - PANGOLIN_API_URL=http://pangolin-api:8080
      - MINIO_URL=http://minio:9000
      - AWS_ENDPOINT_URL=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
      - TEST_MODE=${TEST_MODE:-no-auth}
    depends_on:
      - pangolin-api
    # B10: this ran scripts/test_release_v0.2.0.py, which does not exist in
    # scripts/ - so the verification step failed on a missing file rather than
    # verifying anything.
    command: sh -c "pip install requests pyiceberg pyarrow && python scripts/integration_test.py"

volumes:
  minio_data_release:
