name: CI

# Every finding in AUDIT_EXECUTION_PLAN.md is a direct or indirect consequence
# of there being no CI on push or pull request. The only workflow before this
# one was tag-triggered release building, so nothing ever verified that a commit
# compiled, passed tests, was formatted or was lint-clean — which is exactly how
# the test suite rotted to the point where `cargo test --workspace` executed
# zero tests.

on:
  push:
    branches: [main, "hardening/**", "release/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep the debug artefacts small; CI does not need line tables.
  CARGO_PROFILE_TEST_DEBUG: 0
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: pangolin

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pangolin
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      # Not yet `-D warnings`: the tree still carries warnings inherited from
      # before CI existed. The gate is that the count must not grow — see
      # `clippy-ratchet` below — and it flips to blocking once the backlog is
      # cleared (Phase 2.2).
      - run: cargo clippy --workspace --all-targets
        env:
          RUSTFLAGS: ""

  clippy-ratchet:
    name: clippy warning count
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pangolin
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Count warnings and compare against the budget
        env:
          RUSTFLAGS: ""
        run: |
          # `--message-format short` emits one `path:line:col: warning: ...`
          # line per finding, plus per-crate summary lines that start with
          # "warning:". Count only the former.
          count=$(cargo clippy --workspace --all-targets --message-format short 2>&1 \
            | grep -cE "^[a-zA-Z_/].*warning:" || true)
          budget=$(cat clippy-warning-budget.txt)
          echo "clippy warnings: $count (budget: $budget)"
          if [ "$count" -gt "$budget" ]; then
            echo "::error::clippy warnings rose from $budget to $count."
            echo "Fix the new warnings, or lower the budget if you removed some."
            exit 1
          fi
          if [ "$count" -lt "$budget" ]; then
            echo "::notice::clippy warnings fell to $count; lower clippy-warning-budget.txt."
          fi

  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The default job proves a clean checkout is green with nothing but a
          # Rust toolchain — the property that was missing entirely.
          - name: no external services
            services: false
          - name: with PostgreSQL and MongoDB
            services: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pangolin
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Start databases
        if: matrix.services
        working-directory: .
        run: |
          docker compose -f docker-compose.db-test.yml up -d postgres mongo
          for _ in $(seq 1 60); do
            if docker compose -f docker-compose.db-test.yml exec -T postgres \
                 pg_isready -U testuser >/dev/null 2>&1; then
              echo "postgres ready"; break
            fi
            sleep 2
          done

      - name: cargo test --workspace
        env:
          RUSTFLAGS: ""
        run: cargo test --workspace --no-fail-fast

      - name: cargo test --workspace (against live databases)
        if: matrix.services
        env:
          RUSTFLAGS: ""
          PANGOLIN_TEST_POSTGRES_URL: postgresql://testuser:testpass@localhost:5432/testdb
          PANGOLIN_TEST_MONGO_URL: mongodb://testuser:testpass@localhost:27017
        # MongoDB parity is still incomplete; see the Known limitations section
        # of the README. PostgreSQL is the gate.
        run: cargo test -p pangolin_store --no-fail-fast -- --skip mongo

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: pangolin

  helm:
    name: helm lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: |
          helm lint deployment_assets/helm/pangolin \
            --set-string secrets.PANGOLIN_JWT_SECRET=ci-only-secret-of-adequate-length-000
      # `helm template` catches templates that reference values which do not
      # exist, and values that reference templates which do not exist — the
      # exact failure mode that shipped in the chart (A-34).
      - run: |
          helm template pangolin deployment_assets/helm/pangolin \
            --set-string secrets.PANGOLIN_JWT_SECRET=ci-only-secret-of-adequate-length-000 \
            --set ingress.enabled=true \
            --set autoscaling.enabled=true \
            --set replicaCount=3 > /dev/null
      - name: The chart must refuse to render without a signing secret
        run: |
          if helm template pangolin deployment_assets/helm/pangolin > /dev/null 2>&1; then
            echo "::error::the chart rendered with no PANGOLIN_JWT_SECRET"
            exit 1
          fi
          echo "chart correctly refuses to render without a signing secret"

  docker:
    name: docker build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: pangolin
          file: pangolin/Dockerfile
          push: false
          load: true
          tags: pangolin-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The container must not run as root
        run: |
          user=$(docker inspect --format '{{.Config.User}}' pangolin-api:ci)
          echo "image user: ${user:-<root>}"
          if [ -z "$user" ] || [ "$user" = "root" ] || [ "$user" = "0" ]; then
            echo "::error::the image runs as root"
            exit 1
          fi

  # Roadmap improvements #0 and #1: the two suites that make whole classes of
  # finding *testable* rather than reviewable.
  #
  #   * the permission matrix drives each sensitive route as Root /
  #     TenantAdmin / TenantUser / a foreign tenant's admin and asserts the
  #     expected 200 or 403. A handler that forgets `check_permission` is
  #     indistinguishable from one that calls it until something asserts the
  #     403 - which is how the B0a-B0m cluster survived a security release.
  #   * the cross-backend parity suite runs the same assertions against all
  #     four stores, which is the only thing that catches one backend quietly
  #     disagreeing with the others.
  #
  # Called out as their own job so a failure here reads as "authorization or
  # backend parity regressed", not as an anonymous test failure.
  guardrails:
    name: authz matrix + backend parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Permission matrix
        run: cargo test -p pangolin_api --lib authz_matrix_tests -- --nocapture
      - name: Cross-backend parity (memory + SQLite)
        run: cargo test -p pangolin_store --test store_integration

  # Deployment artefacts drift from the code that reads them, and nothing
  # noticed. `PANGOLIN_STORE_TYPE` sat in both compose files for several
  # releases while the server read `PANGOLIN_STORAGE_TYPE` (B9); the quick-start
  # compose file could not start the API at all because it set no signing secret
  # (B8); and the release compose file pinned an image four versions old and ran
  # a verification script that did not exist (B10). All three are the same
  # failure: config that is never validated.
  config-drift:
    name: config drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Every compose file must be valid
        env:
          PANGOLIN_JWT_SECRET: ci-only-secret-of-adequate-length-0000000
        run: |
          for f in docker-compose*.yml; do
            echo "validating $f"
            docker compose -f "$f" config > /dev/null
          done

      - name: The quick start must fail loudly without a signing secret
        run: |
          # `docker compose config` must *fail* here: the `:?` form on
          # PANGOLIN_JWT_SECRET is what turns a crash-looping container into an
          # immediate, explicable error.
          if docker compose -f docker-compose.yml config > /dev/null 2>&1; then
            echo "::error::docker-compose.yml accepted an unset PANGOLIN_JWT_SECRET"
            exit 1
          fi
          echo "compose correctly refuses to start without a signing secret"

      - name: No compose file may set a variable the server does not read
        run: |
          # PANGOLIN_STORE_TYPE is the specific name that survived for releases;
          # the general check below catches its successors.
          if grep -n 'PANGOLIN_STORE_TYPE' docker-compose*.yml deployment_assets 2>/dev/null | grep -v 'not read'; then
            echo "::error::PANGOLIN_STORE_TYPE is not read by the server; use PANGOLIN_STORAGE_TYPE"
            exit 1
          fi
          for name in $(grep -rhoE 'PANGOLIN_[A-Z0-9_]+' docker-compose*.yml | sort -u); do
            if ! grep -rq "$name" pangolin/pangolin_api/src pangolin/pangolin_store/src; then
              echo "::error::$name appears in a compose file but no code reads it"
              exit 1
            fi
          done
          echo "every PANGOLIN_* name in the compose files is read by the server"

      - name: The environment-variable reference must match the code
        working-directory: pangolin
        run: ./scripts/check_env_var_docs.sh

  # Improvement #2: the SDK and UI had no CI at all - only Rust, Helm and
  # Docker were covered. That is exactly where the 0.6.0 "no CI, silent rot"
  # lesson was repeating: the SDK's test suite could not even *collect*
  # (B41) and the UI's vitest config broke every suite that imported the API
  # client (B46), and nothing noticed either.
  sdk:
    name: python sdk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pypangolin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[iceberg]'
          pip install pytest ruff
      - name: The package must import without the Iceberg extra
        run: |
          # B41 regression: `pip install pypangolin` then `import pypangolin`
          # must not require the whole Iceberg stack.
          pip uninstall -y pyiceberg
          python -c "import pypangolin; print(pypangolin.__version__)"
      - name: The version must match the package metadata
        run: |
          # B38: `__version__` was hardcoded to 0.1.0 against a 0.6.0 package.
          python - <<'PY'
          from importlib.metadata import version
          import pypangolin
          assert pypangolin.__version__ == version("pypangolin"), (
              f"__version__ {pypangolin.__version__} != metadata {version('pypangolin')}"
          )
          print("version is single-sourced")
          PY
      - run: ruff check src
      - run: pytest -q

  ui:
    name: management ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pangolin_ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: The UI must build
        run: npm run build
      - name: No raw /api/v1 fetches may reappear
        run: |
          # B32: a relative `fetch('/api/v1/...')` works under the dev proxy and
          # 404s in production, while also skipping the tenant header. Every
          # call must go through apiClient, which is not something a type check
          # can express.
          # Comment lines are excluded: several carry the offending pattern
          # verbatim while explaining why it is wrong.
          if grep -rnE "fetch\((['\`\"])/api/v1" src/ | grep -vE ":[[:space:]]*(//|\*|/\*)"; then
            echo "::error::raw /api/v1 fetch found; route it through apiClient"
            exit 1
          fi
          echo "no raw /api/v1 fetches"
      - name: Only PUBLIC_API_URL may name the API base URL
        run: |
          # B31: four different spellings coexisted and none agreed, so every
          # deployed build called the visitor's own localhost.
          if grep -rn "VITE_API_URL" src/ .env.example vitest.config.ts 2>/dev/null \
               | grep -vE ":[[:space:]]*(//|#|\*|/\*)"; then
            echo "::error::VITE_API_URL is not read by SvelteKit; use PUBLIC_API_URL"
            exit 1
          fi
          echo "PUBLIC_API_URL is the only spelling"
