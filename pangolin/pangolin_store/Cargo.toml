[package]
name = "pangolin_store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
pangolin_core = { path = "../pangolin_core", features = ["sqlx"] }
object_store = { workspace = true }
async-trait = { workspace = true }
dashmap = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
aws-sdk-s3 = { version = "1.0", features = ["behavior-version-latest"] }
aws-config = { version = "1.0", features = ["behavior-version-latest"] }
aws-credential-types = "1.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "sqlite", "uuid", "chrono", "json"] }
mongodb = "3.4.1"
bson = { version = "2.14", features = ["uuid-1", "chrono-0_4"] }
aws-sdk-sts = { version = "1.0", features = ["behavior-version-latest"] }
azure_storage_blobs = { version = "0.20", optional = true }
azure_core = { version = "0.20", optional = true }
google-cloud-storage = { version = "0.20", optional = true }
google-cloud-auth = { version = "0.16", optional = true }
moka = { version = "0.12", features = ["future"] }
# Using reqwest for manual HTTP calls/mocks if needed
# Using reqwest for manual HTTP calls/mocks if needed
reqwest = { version = "0.12", features = ["json"], optional = true }
regex = "1.10"

[features]
default = ["aws", "azure", "gcp"]
# The AWS SDK is a non-optional dependency: AWS-specific code paths are not
# behind `cfg(feature = "aws")` yet, so this feature is a no-op marker kept for
# forward compatibility. Azure and GCP support is genuinely optional.
aws = []
azure = ["dep:azure_storage_blobs", "dep:azure_core"]
gcp = ["dep:google-cloud-storage", "dep:google-cloud-auth"]
# Compiles `test_support` into the library for integration tests only.
test-support = []

[dev-dependencies]
pangolin_store = { path = ".", features = ["test-support"] }
