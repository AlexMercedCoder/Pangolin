[package]
name = "pangolin_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core domain model for the Pangolin lakehouse catalog: assets, permissions, audit records, and Iceberg table metadata."
readme = "../../README.md"
keywords = ["iceberg", "lakehouse", "catalog", "data"]
categories = ["database"]

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
url = { workspace = true }
utoipa = { version = "4", features = ["chrono", "uuid"] }
sqlx = { version = "0.8.6", optional = true }

[features]
default = ["utoipa"]
utoipa = []
sqlx = ["dep:sqlx"]
