[package]
name = "pangolin_cli_admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Administrative command-line interface for the Pangolin lakehouse catalog."
readme = "../../README.md"
keywords = ["iceberg", "lakehouse", "catalog", "data"]
categories = ["database"]

[lints]
workspace = true

[dependencies]
pangolin_cli_common = { path = "../pangolin_cli_common", version = "0.8.0" }
clap = { version = "4.4", features = ["derive", "env"] }
tokio = { version = "1.0", features = ["full"] }
rustyline = "14.0"
shell-words = "1.1"
anyhow = "1.0"
async-trait = "0.1"
console = "0.15"
dialoguer = "0.11"
log = "0.4"
env_logger = "0.10"
serde_json = "1.0"
urlencoding = "2.1"
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "pangolin-admin"
path = "src/main.rs"

[dev-dependencies]
wiremock = "0.6"
tokio-test = "0.4"
